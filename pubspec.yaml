name: eazyreport
description: Banded document and invoice report printing and rendering engine in pure Dart. Render .rtpl templates with JSON data without JS or browser dependencies.
version: 1.0.1
homepage: https://eazyreport.in
repository: https://github.com/ashiq-kodali/eazyreport
issue_tracker: https://github.com/ashiq-kodali/eazyreport/issues

topics:
  - reporting
  - pdf
  - printing
  - barcode
  - invoice

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  barcode: ^2.2.8
  intl: ^0.19.0
  pdf: ^3.13.1

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0
