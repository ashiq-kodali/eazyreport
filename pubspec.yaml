name: eazyreport
description: Modern banded document and invoice reporting engine in pure Dart. Render .rtpl templates to printable HTML and vector PDF.
version: 1.0.2
homepage: https://eazyreport.in
repository: https://github.com/ashiq-kodali/eazyreport
issue_tracker: https://github.com/ashiq-kodali/eazyreport/issues

topics:
  - reporting
  - pdf
  - printing
  - barcode
  - invoice

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  barcode: ^2.2.8
  intl: ^0.19.0
  pdf: ^3.13.1

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0
